<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Chest Loot Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chest-container" id="chestContainer" onclick="openChest()">
        <div class="loot-display" id="lootDisplay">
            <div class="loot-item" id="lootIcon">⚔️</div>
            <div class="loot-text" id="lootLabel">COMMON ITEM</div>
        </div>

        <div class="chest" id="chestMesh">
            <div class="chest-lid"></div>
            <div class="chest-base">
                <div class="lock"></div>
            </div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetChest()">Close Chest</button>

    <script src="script.js"></script>
</body>
</html>
